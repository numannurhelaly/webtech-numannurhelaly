<!DOCTYPE html>
<html>
<head>
    <title>Lab Task 01</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        /* Element Selector */
        p {
            color: blue;
            font-size: 16px;
        }

        /* Class Selector */
        .highlight {
            background-color: rgb(240, 7, 81);
        }

        /* ID Selector */
        #mainTitle {
            text-align: middle;
        }
    </style>
</head>

<body>

    <!-- Inline CSS -->
    <h2 style="color: rgb(58, 223, 3);">Inline CSS</h2>

    <h1 id="mainTitle">Introduction to CSS</h1>

    <p>This is a paragraph using element selector.</p>

    <p class="highlight">This paragraph uses class selector.</p>

</body>
</html>
