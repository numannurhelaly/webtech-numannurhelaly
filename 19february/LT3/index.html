<!DOCTYPE html>
<html>
<head>
    <title>Box Model & Display Lab</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>CSS Box Model Demo</h1>

    <!-- Box Model Section -->
    <div class="box box1">Box 1 (Default Box Sizing)</div>
    <div class="box box2">Box 2 (Border Box)</div>
    <div class="box box3">Box 3 (Different Spacing)</div>

    <hr>

    <!-- Display Section -->
    <h2>Display Property Examples</h2>

    <div class="block-example">Block Div</div>

    <span class="inline-example">Inline Span</span>
    <span class="inline-example">Inline Span 2</span>

    <p class="inline-block-example">Inline-Block Paragraph</p>

    <div class="none-example">You should not see this (display none)</div>

    <div class="visibility-hidden">Invisible but space remains</div>

</body>
</html>
